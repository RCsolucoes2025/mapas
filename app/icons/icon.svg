<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b7a3e"/>
      <stop offset="0.55" stop-color="#0d4a2a"/>
      <stop offset="1" stop-color="#062417"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#e3122f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe14d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe14d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <!-- talhão (faixa mais clara) -->
    <path d="M-10 128 L128 30 L128 128 Z" fill="#2a8f4a" opacity="0.35"/>
    <!-- linhas de plantio -->
    <g stroke="#ffd60a" stroke-width="5.5" stroke-linecap="round">
      <line x1="-10" y1="46"  x2="70"  y2="-10"/>
      <line x1="-10" y1="70"  x2="104" y2="-10"/>
      <line x1="-10" y1="94"  x2="138" y2="-10"/>
      <line x1="-10" y1="118" x2="138" y2="14"/>
      <line x1="-10" y1="142" x2="138" y2="38"/>
      <line x1="14"  y1="142" x2="138" y2="62"/>
      <line x1="48"  y1="142" x2="138" y2="86"/>
    </g>
    <!-- brilho atrás do pino -->
    <circle cx="82" cy="60" r="44" fill="url(#glow)"/>
    <!-- sombra do pino -->
    <ellipse cx="82" cy="110" rx="17" ry="5" fill="#000" opacity="0.45"/>
    <!-- pino GPS -->
    <path d="M82 110 C73 96 56 84 56 62 A26 26 0 1 1 108 62 C108 84 91 96 82 110 Z"
          fill="url(#pin)" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="82" cy="62" r="10.5" fill="#ffffff"/>
    <circle cx="82" cy="62" r="5" fill="#e3122f"/>
  </g>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
</svg>
